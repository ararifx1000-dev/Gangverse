<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101521"><title>AYTx 🥷</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0e16;--p:#151b29;--p2:#20283a;--line:#30394e;--txt:#f4f5fa;--muted:#9aa6bb;--a:#9276f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:var(--a);color:white;font-weight:700}input,textarea{width:100%;padding:13px;margin:7px 0 12px;border:1px solid var(--line);border-radius:12px;background:#0e1420;color:var(--txt)}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-size:27px;font-weight:900}.brand span{color:#bbaaff}#auth{min-height:100dvh;display:grid;place-items:center;padding:20px}.authbox{width:min(100%,420px);background:var(--p);padding:24px;border:1px solid var(--line);border-radius:20px}.authbox button{width:100%;margin:5px 0}.switch{background:transparent;color:#c9bcff}#app{min-height:100dvh;padding-bottom:78px}.top{position:sticky;top:0;background:#111725ee;backdrop-filter:blur(12px);padding:13px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}.top .brand{font-size:22px}.page{max-width:720px;margin:auto;padding:16px 13px}.heading{font-size:22px;font-weight:800;margin:5px 0 14px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}.item{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:42px;height:42px;border-radius:50%;background:var(--p2);display:grid;place-items:center;object-fit:cover}.grow{flex:1;min-width:0}.item strong,.item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.messages{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow:auto;min-height:30vh;padding:7px}.bubble{max-width:85%;background:var(--p2);border-radius:14px;padding:10px 12px;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#493a7d}.composer{display:flex;gap:7px;align-items:center}.composer input{flex:1;min-width:0;margin:8px 0}.composer button{padding:11px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);background:#111725f5;border-top:1px solid var(--line);padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.nav{background:transparent;color:var(--muted);font-size:11px;padding:5px 1px;display:flex;flex-direction:column;gap:2px;align-items:center}.nav b{font-size:19px}.nav.active{color:#cbbdff}.empty{text-align:center;color:var(--muted);padding:25px 5px}.full{width:100%}.danger{background:#824052}.postimg{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:8px}.tag{background:var(--p2);padding:4px 8px;border-radius:20px;font-size:11px}
.card p,.bubble{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.6}
.chatmeta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.unread{display:inline-flex;background:var(--a);color:white;border-radius:20px;min-width:20px;height:20px;align-items:center;justify-content:center;font-size:11px;padding:0 5px}.newtime{color:#bbaaff}.nav b{position:relative}.nav .unread{position:absolute;left:12px;top:-5px}
</style></head><body>
<section id="auth"><div class="authbox"><div class="brand">AYTx <span>🥷</span></div><p class="muted">Welcome to your community</p><div id="extra" class="hidden"><input id="name" placeholder="Your full name"><input id="username" placeholder="Username"></div><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="authBtn">Login</button><button id="toggle" class="switch">Create a new account</button><p id="authMsg" class="small muted"></p></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">AYTx <span>🥷</span></div><button id="refresh" class="switch">↻ Refresh</button></header><main id="screen" class="page"></main><nav class="bottom"><button class="nav active" data-tab="chats"><b>▤<span id="chatCount" class="unread hidden"></span></b>Chats</button><button class="nav" data-tab="group"><b>◎</b>General</button><button class="nav" data-tab="events"><b>▣</b>Events</button><button class="nav" data-tab="news"><b>▧</b>News</button><button class="nav" data-tab="profile"><b>◉</b>Profile</button></nav></section>
<script>
const db=window.supabase.createClient('https://qverihfqvbqljctwppos.supabase.co','sb_publishable_CWfoYn0dkwuf8r4Jdfw-oA_UyULI8wG');
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile=null,people=[],tab='chats',chosen=null,signup=false;
const admin=()=>['owner','admin','super admin'].includes(String(profile?.role||'').toLowerCase());
const heading=t=>'<div class="heading">'+t+'</div>';
const avatar=p=>p?.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'">':'<div class="avatar">'+esc((p?.display_name||p?.username||'?')[0].toUpperCase())+'</div>';
async function load(){let r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;profile=r.data;r=await db.from('profiles').select('id,username,display_name,avatar_url,role').neq('id',user.id).order('display_name');if(r.error)throw r.error;people=r.data||[];$('auth').classList.add('hidden');$('app').classList.remove('hidden');render()}
$('toggle').onclick=()=>{signup=!signup;$('extra').classList.toggle('hidden',!signup);$('authBtn').textContent=signup?'Create account':'Login';$('toggle').textContent=signup?'Login':'Create a new account'};
$('authBtn').onclick=async()=>{try{let email=$('email').value.trim(),password=$('pass').value;if(!email||!password)throw Error('Enter your email and password');$('authBtn').disabled=true;if(signup){let display_name=$('name').value.trim(),username=$('username').value.trim();if(!display_name||!username)throw Error('Enter your name and username');let r=await db.auth.signUp({email,password,options:{data:{display_name,username}}});if(r.error)throw r.error;if(r.data.session){user=r.data.user;await load()}else $('authMsg').textContent='Account created. Please verify your email, then log in.'}else{let r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;user=r.data.user;await load()}}catch(e){$('authMsg').textContent=e.message}finally{$('authBtn').disabled=false}};
db.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;try{await load()}catch(e){alert(e.message)}}});
db.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){user=null;inbox=[];inboxOwner=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden')}});
$('refresh').onclick=async()=>{try{await load()}catch(e){alert(e.message)}};
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;chosen=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()});
function render(){({chats:chats,group:group,events:events,news:news,profile:profilePage}[tab])()}
let inbox=[],inboxBusy=false,inboxOwner=null;
function readKey(peer){return 'aytx-read:'+user.id+':'+peer}
function readTime(peer){try{return localStorage.getItem(readKey(peer))||''}catch{return ''}}
function markRead(peer,rows){const last=rows.filter(m=>m.sender_id===peer).reduce((v,m)=>m.created_at>v?m.created_at:v,readTime(peer));try{localStorage.setItem(readKey(peer),last)}catch{}}
function unread(peer){return inbox.filter(m=>m.sender_id===peer&&m.receiver_id===user.id&&m.created_at>readTime(peer)).length}
function latest(peer){return inbox.find(m=>m.sender_id===peer||m.receiver_id===peer)}
function personRow(p){const m=latest(p.id),n=unread(p.id);return '<div class="item" data-id="'+esc(p.id)+'">'+avatar(p)+'<div class="grow"><strong>'+esc(p.display_name||p.username||'Member')+'</strong><small class="muted">'+esc(m?(m.sender_id===user.id?'You: ':'')+m.message:'@'+(p.username||'member'))+'</small></div><div class="chatmeta"><small class="'+(n?'newtime':'muted')+'">'+(m?esc(new Date(m.created_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})):'')+'</small>'+(n?'<span class="unread">'+n+'</span>':'')+'</div></div>'}
function paintInbox(){if(!user||$('app').classList.contains('hidden'))return;const total=inbox.filter(m=>m.receiver_id===user.id&&m.created_at>readTime(m.sender_id)).length;const badge=$('chatCount');badge.textContent=total||'';badge.classList.toggle('hidden',!total);const list=$('chatList');if(!list||chosen||tab!=='chats')return;const sorted=[...people].sort((a,b)=>(latest(b.id)?.created_at||'').localeCompare(latest(a.id)?.created_at||''));const html=sorted.map(personRow).join('')||'<div class="empty">No other members yet.</div>';if(list.innerHTML!==html){list.innerHTML=html;list.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{chosen=people.find(p=>p.id===x.dataset.id);chats()})}}
async function refreshInbox(){if(inboxBusy||!user||document.hidden||$('app').classList.contains('hidden'))return;inboxBusy=true;const uid=user.id;try{let rows=[];for(let start=0;;start+=500){const r=await db.from('direct_messages').select('id,sender_id,receiver_id,message,created_at').or('sender_id.eq.'+uid+',receiver_id.eq.'+uid).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);if(r.error)return;rows.push(...r.data);if(r.data.length<500)break}if(user?.id!==uid||$('app').classList.contains('hidden'))return;inboxOwner=uid;inbox=rows;paintInbox()}finally{inboxBusy=false}}
setInterval(refreshInbox,2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshInbox()});
function watchMessages(target,get){const timer=setInterval(()=>{if(!target.isConnected||!user){clearInterval(timer);return}if(!document.hidden)get()},2000)}
async function chats(){let s=$('screen');if(!chosen){if(inboxOwner!==user.id)inbox=[];s.innerHTML=heading('Chats')+'<p class="muted small">Select a member to start a private chat.</p><div class="card" id="chatList"></div>';paintInbox();refreshInbox();return}
s.innerHTML=heading('<span id="back">‹</span> '+esc(chosen.display_name||chosen.username))+'<div class="card"><div id="msgs" class="messages"></div><div class="composer"><input id="msg" placeholder="Write a message"><button id="send">Send</button></div></div>';$('back').onclick=()=>{chosen=null;chats()};
const peer=chosen.id;const target=$('msgs'),uid=user.id;let busy=false;async function get(){if(busy||!target.isConnected||user?.id!==uid)return;busy=true;try{let r=await db.from('direct_messages').select('*').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+peer+'),and(sender_id.eq.'+peer+',receiver_id.eq.'+user.id+')').order('created_at');if(!target.isConnected||user?.id!==uid)return;if(!r.error&&!document.hidden){markRead(peer,r.data||[]);paintInbox()}const html=r.error?esc(r.error.message):(r.data||[]).map(m=>'<div class="bubble '+(m.sender_id===user.id?'mine':'')+'">'+esc(m.message)+'</div>').join('')||'<div class="empty">No messages yet.</div>';if(target.innerHTML!==html)target.innerHTML=html}finally{busy=false}}
$('send').onclick=async()=>{let message=$('msg').value.trim();if(!message)return;let r=await db.from('direct_messages').insert({sender_id:user.id,receiver_id:chosen.id,message});if(r.error)alert(r.error.message);else{$('msg').value='';get()}};get();watchMessages(target,get)}
async function group(){let s=$('screen');s.innerHTML=heading('General Group')+'<p class="muted small">A group chat for all members.</p><div class="card"><div id="msgs" class="messages"></div><div class="composer"><input id="msg" placeholder="Message everyone"><button id="send">Send</button></div></div>';const target=$('msgs'),uid=user.id;let busy=false;async function get(){if(busy||!target.isConnected||user?.id!==uid)return;busy=true;try{let r=await db.from('general_messages').select('*,profiles(display_name,username)').order('created_at').limit(100);if(!target.isConnected||user?.id!==uid)return;const html=r.error?esc(r.error.message):(r.data||[]).map(m=>'<div class="bubble '+(m.user_id===user.id?'mine':'')+'"><b class="small">'+esc(m.profiles?.display_name||m.profiles?.username||'Member')+'</b><br>'+esc(m.message)+'</div>').join('')||'<div class="empty">No messages yet.</div>';if(target.innerHTML!==html)target.innerHTML=html}finally{busy=false}}$('send').onclick=async()=>{let message=$('msg').value.trim();if(!message)return;let r=await db.from('general_messages').insert({user_id:user.id,message});if(r.error)alert(r.error.message);else{$('msg').value='';get()}};get();watchMessages(target,get)}
async function events(){let s=$('screen');s.innerHTML=heading('Events')+'<p class="muted small">Events and announcements from admins.</p>'+(admin()?'<div class="card"><input id="et" placeholder="Event title"><textarea id="ed" placeholder="Description"></textarea><label class="small muted">Event image (optional)</label><input id="eventImage" type="file" accept="image/jpeg,image/png,image/webp"><button id="add">Create Event</button></div>':'')+'<div id="list"></div>';const list=$('list');if(admin()){const btn=$('add');btn.onclick=async()=>{const title=$('et').value.trim(),description=$('ed').value.trim(),f=$('eventImage').files[0];if(!title)return alert('Enter an event title.');if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image under 5 MB.');btn.disabled=true;try{let image_url=null;if(f){const path=user.id+'/events/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await db.storage.from('aytx-media').upload(path,f);if(u.error)throw u.error;image_url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const x=await db.from('events').insert({title,description,created_by:user.id,image_url});if(x.error)throw x.error;if(tab==='events')events()}catch(e){alert(e.message)}finally{btn.disabled=false}}}const r=await db.from('events').select('*').order('created_at',{ascending:false});list.innerHTML=r.error?esc(r.error.message):((r.data||[]).map(e=>'<div class="card"><b>'+esc(e.title)+'</b><p>'+esc(e.description)+'</p>'+(e.image_url?'<img class="postimg" src="'+esc(e.image_url)+'" alt="Event image">':'')+'<small class="muted">'+new Date(e.created_at).toLocaleString()+'</small></div>').join('')||'<div class="empty">No events yet.</div>')}
async function news(){let s=$('screen');s.innerHTML=heading('News')+'<p class="muted small">Share an image or screenshot with a caption.</p><div class="card"><textarea id="cap" placeholder="Write a caption"></textarea><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="post">Post</button></div><div id="list"></div>';$('post').onclick=async()=>{let f=$('file').files[0],image_url=null;if(f){if(f.size>5242880)return alert('Image must be smaller than 5 MB');let path=user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await db.storage.from('aytx-media').upload(path,f);if(u.error)return alert(u.error.message);image_url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}let x=await db.from('news_posts').insert({user_id:user.id,caption:$('cap').value.trim(),image_url});if(x.error)alert(x.error.message);else news()};let r=await db.from('news_posts').select('*,profiles(display_name,username)').order('created_at',{ascending:false}).limit(50);$('list').innerHTML=r.error?esc(r.error.message):(r.data||[]).map(p=>'<div class="card"><b>'+esc(p.profiles?.display_name||p.profiles?.username||'Member')+'</b><p>'+esc(p.caption)+'</p>'+(p.image_url?'<img class="postimg" src="'+esc(p.image_url)+'">':'')+'</div>').join('')||'<div class="empty">No posts yet.</div>'}
function profilePage(){let p=profile||{};$('screen').innerHTML=heading('Profile')+'<div class="card">'+avatar(p)+'<b>'+esc(p.display_name||p.username||'Member')+'</b><p class="muted small">@'+esc(p.username||'')+' · '+esc(p.role||'Member')+'</p></div><div class="card"><label class="small muted">Display name</label><input id="pn" value="'+esc(p.display_name||'')+'"><label class="small muted">Profile photo (optional)</label><input id="pa" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted small">Choose a gaming avatar. JPG, PNG or WebP, up to 5 MB.</p><button id="save" class="full">Save Profile</button></div><div class="card muted small">'+esc(user.email||'')+'</div><button id="out" class="danger full">Logout</button>';$('save').onclick=async()=>{const btn=$('save'),f=$('pa').files[0],name=$('pn').value.trim();if(!name)return alert('Enter a display name.');if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image up to 5 MB.');btn.disabled=true;try{let url=p.avatar_url||null;if(f){const path=user.id+'/avatars/'+crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type]);const u=await db.storage.from('aytx-media').upload(path,f);if(u.error)throw u.error;url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const r=await db.from('profiles').update({display_name:name,avatar_url:url}).eq('id',user.id);if(r.error)throw r.error;await load();alert('Profile saved')}catch(e){alert(e.message)}finally{btn.disabled=false}};$('out').onclick=()=>db.auth.signOut()}
</script></body></html>
