<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GANGVERSE — Two Gangs, One Community</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #07090f;
      --panel: #0e1320;
      --panel-2: #141b2e;
      --border: #23304d;
      --red: #ff2a4b;
      --blue: #00b8ff;
      --text: #eef4ff;
      --muted: #8fa1c2;
      --ok: #18d98c;
      --warn: #ffbe2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    body {
      background: radial-gradient(circle at top right, rgba(0, 184, 255, 0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(255, 42, 75, 0.12), transparent 45%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
    }

    .container { max-width: 780px; margin: 0 auto; }

    .header {
      background: linear-gradient(135deg, rgba(255, 42, 75, 0.16), rgba(0, 184, 255, 0.16));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 1.45rem;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--red), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      transition: 0.15s;
      touch-action: manipulation;
    }

    button:hover { border-color: var(--blue); }

    button.primary {
      background: linear-gradient(90deg, var(--red), #c91836);
      border: none;
      color: #fff;
    }

    button.blue-btn {
      background: linear-gradient(90deg, #0088cc, var(--blue));
      border: none;
      color: #051018;
      font-weight: 700;
    }

    button.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 1px var(--blue);
      color: #fff;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }

    input, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
    }

    input:focus, select:focus { outline: none; border-color: var(--blue); }

    .id-card {
      background: linear-gradient(125deg, #131a2d 0%, #0b0f1a 60%, rgba(255,42,75,0.18) 100%);
      border: 1px solid rgba(0, 184, 255, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .id-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .gang-ilgx { color: var(--red); border-color: rgba(255, 42, 75, 0.5); }
    .gang-mbcx { color: var(--blue); border-color: rgba(0, 184, 255, 0.5); }

    .chat-box {
      height: 320px;
      overflow-y: auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 11px;
    }

    .msg-head { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; gap: 8px; }
    .msg-author { font-weight: 700; color: var(--text); }
    .msg-body { font-size: 0.9rem; word-break: break-word; line-height: 1.4; }

    .status { font-size: 0.82rem; margin-top: 10px; padding: 8px 10px; border-radius: 8px; display: none; }
    .status.ok { display: block; background: rgba(24, 217, 140, 0.12); color: var(--ok); border: 1px solid rgba(24, 217, 140, 0.35); }
    .status.err { display: block; background: rgba(255, 42, 75, 0.12); color: #ff758c; border: 1px solid rgba(255, 42, 75, 0.35); }

    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .char-count { font-size: 0.76rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <h1>GANGVERSE</h1>
        <p>Two Gangs, One Community • Flex City (ILGx &amp; MBCx)</p>
      </div>
      <div id="authStatusBadge" class="badge">Offline</div>
    </div>

    <!-- AUTH SECTION -->
    <div id="authSection" class="card">
      <div class="tabs">
        <button type="button" id="tabLogin" class="active">Login</button>
        <button type="button" id="tabSignup">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" style="display: block;">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" required placeholder="player@example.com" />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" required placeholder="Your password" />

        <div style="margin-top: 14px;">
          <button type="submit" class="primary">Login to Gangverse</button>
        </div>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" style="display: none;">
        <div class="grid-2">
          <div>
            <label for="regUsername">Username</label>
            <input id="regUsername" type="text" required minlength="3" maxlength="24" placeholder="e.g. shadow_rx" />
          </div>
          <div>
            <label for="regDisplayName">Display Name</label>
            <input id="regDisplayName" type="text" required maxlength="30" placeholder="e.g. Shadow RX" />
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="regGang">Select Gang</label>
            <select id="regGang" required>
              <option value="ILGx">ILGx</option>
              <option value="MBCx">MBCx</option>
            </select>
          </div>
          <div>
            <label for="regPlayerId">Flex City Player ID</label>
            <input id="regPlayerId" type="text" required maxlength="25" placeholder="e.g. FC-10492" />
          </div>
        </div>

        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" required placeholder="player@example.com" />

        <label for="regPassword">Password (min 6 chars)</label>
        <input id="regPassword" type="password" required minlength="6" placeholder="Create password" />

        <div style="margin-top: 14px;">
          <button type="submit" class="blue-btn">Create Account</button>
        </div>
      </form>

      <div id="authMsg" class="status"></div>
    </div>

    <!-- APP SECTION (WHEN LOGGED IN) -->
    <div id="appSection" style="display: none;">
      <!-- MEMBER ID CARD -->
      <div class="id-card">
        <div class="id-top">
          <div>
            <div style="font-size: 0.72rem; color: var(--muted); letter-spacing: 1px;">FLEX CITY MEMBER ID</div>
            <div id="cardDisplayName" style="font-size: 1.15rem; font-weight: 800; margin-top: 2px;">Loading...</div>
            <div id="cardMeta" style="font-size: 0.82rem; color: var(--muted);">@username • ID: -</div>
          </div>
          <div style="text-align: right;">
            <span id="cardGang" class="badge gang-ilgx">ILGx</span>
            <div id="cardRole" style="font-size: 0.76rem; color: var(--warn); margin-top: 6px; font-weight: 700;">Role: Member</div>
          </div>
        </div>
        <div class="row-between" style="margin-top: 8px;">
          <span style="font-size: 0.75rem; color: var(--muted);">Status: Active Community Member</span>
          <button type="button" id="btnLogout">Logout</button>
        </div>
      </div>

      <!-- REAL-TIME CHAT -->
      <div class="card">
        <div class="row-between" style="margin-bottom: 10px;">
          <div class="tabs" style="margin-bottom: 0;">
            <button type="button" id="chGlobal" class="active">Global</button>
            <button type="button" id="chILGx">ILGx</button>
            <button type="button" id="chMBCx">MBCx</button>
          </div>
          <span id="rtStatus" class="badge" style="color: var(--ok);">Realtime: Connecting...</span>
        </div>

        <div id="chatMessages" class="chat-box">
          <div style="color: var(--muted); font-size: 0.85rem;">Loading messages...</div>
        </div>

        <form id="chatForm">
          <input
            id="chatInput"
            type="text"
            maxlength="300"
            required
            placeholder="Write a message (max 300 chars)..."
          />
          <div class="row-between" style="margin-top: 8px;">
            <span id="charCount" class="char-count">0 / 300</span>
            <button type="submit" class="blue-btn">Send Message</button>
          </div>
        </form>

        <div id="chatMsg" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://qverihfqvbqljctwppos.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CWfoYn0dkwuf8r4Jdfw-oA_UyULI8wG";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;
    let currentChannel = "global";
    let profilesMap = {};
    let chatSubscription = null;

    function getChannelLabel(channel) {
      if (channel === "global") return "Global";
      return channel;
    }

    function showStatus(elId, text, isError = false) {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = "status " + (isError ? "err" : "ok");
    }

    function clearStatus(elId) {
      const el = document.getElementById(elId);
      el.className = "status";
      el.textContent = "";
    }

    function switchAuthTab(mode) {
      clearStatus("authMsg");
      const isLogin = mode === "login";
      document.getElementById("loginForm").style.display = isLogin ? "block" : "none";
      document.getElementById("signupForm").style.display = isLogin ? "none" : "block";
      document.getElementById("tabLogin").classList.toggle("active", isLogin);
      document.getElementById("tabSignup").classList.toggle("active", !isLogin);
    }

    async function handleSignup(e) {
      e.preventDefault();
      clearStatus("authMsg");

      const username = document.getElementById("regUsername").value.trim();
      const display_name = document.getElementById("regDisplayName").value.trim();
      const gang = document.getElementById("regGang").value;
      const player_id = document.getElementById("regPlayerId").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { username, display_name, gang, player_id }
        }
      });

      if (error) {
        showStatus("authMsg", "Registration failed: " + error.message, true);
        return;
      }

      if (data.session) {
        showStatus("authMsg", "Account created! Entering Gangverse...");
      } else {
        showStatus("authMsg", "Account created! Please check your email inbox/spam to confirm your account, then login.");
        switchAuthTab("login");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearStatus("authMsg");

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        showStatus("authMsg", "Login failed: " + error.message, true);
      }
    }

    async function handleLogout() {
      if (chatSubscription) {
        await sb.removeChannel(chatSubscription);
        chatSubscription = null;
      }
      await sb.auth.signOut();
    }

    async function loadProfilesMap() {
      const { data, error } = await sb
        .from("profiles")
        .select("id, username, display_name, gang, role, player_id");

      if (!error && Array.isArray(data)) {
        profilesMap = {};
        for (const p of data) {
          profilesMap[p.id] = p;
        }
      }
    }

    async function loadMyProfile() {
      await loadProfilesMap();

      const { data: ownRows } = await sb
        .from("profiles")
        .select("id, username, display_name, gang, role, player_id")
        .eq("id", currentUser.id)
        .limit(1);

      const ownData = Array.isArray(ownRows) && ownRows.length > 0 ? ownRows[0] : null;

      currentProfile = ownData || profilesMap[currentUser.id] || {
        id: currentUser.id,
        username: currentUser.email.split("@")[0],
        display_name: currentUser.email.split("@")[0],
        gang: "ILGx",
        role: "Member",
        player_id: "-"
      };

      document.getElementById("cardDisplayName").textContent = currentProfile.display_name || currentProfile.username;
      document.getElementById("cardMeta").textContent = `@${currentProfile.username} • Player ID: ${currentProfile.player_id || "-"}`;
      document.getElementById("cardRole").textContent = `Role: ${currentProfile.role || "Member"}`;

      const gangBadge = document.getElementById("cardGang");
      gangBadge.textContent = currentProfile.gang || "ILGx";
      gangBadge.className = "badge " + (currentProfile.gang === "MBCx" ? "gang-mbcx" : "gang-ilgx");
    }

    function selectChannel(channel) {
      currentChannel = channel;
      document.getElementById("chGlobal").classList.toggle("active", channel === "global");
      document.getElementById("chILGx").classList.toggle("active", channel === "ILGx");
      document.getElementById("chMBCx").classList.toggle("active", channel === "MBCx");
      clearStatus("chatMsg");
      loadMessages();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMessageRow(row) {
      const sender = profilesMap[row.user_id] || (currentUser && row.user_id === currentUser.id ? currentProfile : null);
      const name = sender ? (sender.display_name || sender.username) : "Member";
      const gang = sender ? sender.gang : "";
      const time = row.created_at ? new Date(row.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";

      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `
        <div class="msg-head">
          <span><span class="msg-author">${escapeHtml(name)}</span> ${gang ? `<span style="color: ${gang === "MBCx" ? "var(--blue)" : "var(--red)"};">[${escapeHtml(gang)}]</span>` : ""}</span>
          <span>${escapeHtml(time)}</span>
        </div>
        <div class="msg-body">${escapeHtml(row.message)}</div>
      `;
      return div;
    }

    async function loadMessages() {
      const box = document.getElementById("chatMessages");
      const label = getChannelLabel(currentChannel);
      box.innerHTML = `<div style="color: var(--muted); font-size: 0.85rem;">Loading ${escapeHtml(label)} chat...</div>`;

      await loadProfilesMap();

      const { data, error } = await sb
        .from("chat_messages")
        .select("id, user_id, message, chat_type, created_at")
        .eq("chat_type", currentChannel)
        .order("created_at", { ascending: true })
        .limit(80);

      if (error) {
        box.innerHTML = `<div style="color: #ff758c; font-size: 0.85rem;">Failed to load messages: ${escapeHtml(error.message)}</div>`;
        return;
      }

      box.innerHTML = "";
      if (!data || data.length === 0) {
        box.innerHTML = `<div style="color: var(--muted); font-size: 0.85rem;">No messages in ${escapeHtml(label)} yet. Start the conversation!</div>`;
        return;
      }

      for (const row of data) {
        box.appendChild(renderMessageRow(row));
      }
      box.scrollTop = box.scrollHeight;
    }

    function subscribeRealtime() {
      if (chatSubscription) {
        sb.removeChannel(chatSubscription);
      }

      const rtBadge = document.getElementById("rtStatus");
      rtBadge.textContent = "Realtime: Connecting...";

      chatSubscription = sb
        .channel("gangverse-realtime-chat")
        .on(
          "postgres_changes",
          { event: "INSERT", schema: "public", table: "chat_messages" },
          async (payload) => {
            const newRow = payload.new;
            if (!newRow || newRow.chat_type !== currentChannel) return;

            if (!profilesMap[newRow.user_id]) {
              await loadProfilesMap();
            }

            const box = document.getElementById("chatMessages");
            if (box.textContent.includes("No messages in")) {
              box.innerHTML = "";
            }
            box.appendChild(renderMessageRow(newRow));
            box.scrollTop = box.scrollHeight;
          }
        )
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            rtBadge.textContent = "Realtime: Live";
            rtBadge.style.color = "var(--ok)";
          } else {
            rtBadge.textContent = "Realtime: " + status;
            rtBadge.style.color = "var(--warn)";
          }
        });
    }

    function updateCharCount() {
      const len = document.getElementById("chatInput").value.length;
      document.getElementById("charCount").textContent = `${len} / 300`;
    }

    async function sendMessage(e) {
      e.preventDefault();
      clearStatus("chatMsg");

      const input = document.getElementById("chatInput");
      const text = input.value.trim();

      if (!text) return;
      if (text.length > 300) {
        showStatus("chatMsg", "Message cannot exceed 300 characters.", true);
        return;
      }

      const { error } = await sb.from("chat_messages").insert({
        user_id: currentUser.id,
        message: text,
        chat_type: currentChannel
      });

      if (error) {
        showStatus("chatMsg", "Send failed: " + error.message, true);
        return;
      }

      input.value = "";
      updateCharCount();
    }

    async function handleAuthStateChange(session) {
      const badge = document.getElementById("authStatusBadge");
      const authSec = document.getElementById("authSection");
      const appSec = document.getElementById("appSection");

      if (session && session.user) {
        currentUser = session.user;
        badge.textContent = "Online";
        badge.style.color = "var(--ok)";
        authSec.style.display = "none";
        appSec.style.display = "block";

        await loadMyProfile();
        await loadMessages();
        subscribeRealtime();
      } else {
        currentUser = null;
        currentProfile = null;
        badge.textContent = "Offline";
        badge.style.color = "var(--muted)";
        appSec.style.display = "none";
        authSec.style.display = "block";
      }
    }

    function bindEvents() {
      document.getElementById("tabLogin").addEventListener("click", () => switchAuthTab("login"));
      document.getElementById("tabSignup").addEventListener("click", () => switchAuthTab("signup"));
      document.getElementById("loginForm").addEventListener("submit", handleLogin);
      document.getElementById("signupForm").addEventListener("submit", handleSignup);
      document.getElementById("btnLogout").addEventListener("click", handleLogout);

      document.getElementById("chGlobal").addEventListener("click", () => selectChannel("global"));
      document.getElementById("chILGx").addEventListener("click", () => selectChannel("ILGx"));
      document.getElementById("chMBCx").addEventListener("click", () => selectChannel("MBCx"));

      document.getElementById("chatInput").addEventListener("input", updateCharCount);
      document.getElementById("chatForm").addEventListener("submit", sendMessage);
    }

    async function initSession() {
      bindEvents();
      const { data: { session } } = await sb.auth.getSession();
      handleAuthStateChange(session);

      sb.auth.onAuthStateChange((_event, session) => {
        handleAuthStateChange(session);
      });
    }

    initSession();
  </script>
</body>
</html>
