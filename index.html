const mediaPending=new WeakSet(),mediaCache=new Map();function secureImages(){for(const img of document.querySelectorAll('img[data-media]'))secureImage(img);}async function secureImage(img){if(mediaPending.has(img)||!user)return;mediaPending.add(img);const uid=user.id;img.decoding='async';if(img.classList.contains('postimg'))img.loading='lazy';try{const u=new URL(img.dataset.media),prefix='/storage/v1/object/public/aytx-media/';if(u.origin!=='https://qverihfqvbqljctwppos.supabase.co'||!u.pathname.startsWith(prefix))return;const path=decodeURIComponent(u.pathname.slice(prefix.length)),key=uid+':'+path;let entry=mediaCache.get(key);if(!entry||entry.until<Date.now()){entry={until:Date.now()+240000,promise:db.storage.from('aytx-media').createSignedUrl(path,300)};mediaCache.set(key,entry);if(mediaCache.size>300)mediaCache.delete(mediaCache.keys().next().value);}const r=await entry.promise;if(r.error){if(mediaCache.get(key)===entry)mediaCache.delete(key);return;}if(img.isConnected&&user?.id===uid)img.src=r.data.signedUrl;}catch{}} const mediaObserver=new MutationObserver(secureImages);mediaObserver.observe(document.body,{childList:true,subtree:true});

async function pushCall(body){const {data:{session}}=await db.auth.getSession();if(!session)throw Error('Login required');const response=await fetch('https://qverihfqvbqljctwppos.supabase.co/functions/v1/aytx-push',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error('Push server: '+response.status);return data}
async function enablePush(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Notifications are unavailable in this browser.');const uid=user.id;const permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Notification permission not granted.');await navigator.serviceWorker.register('./sw.js');const reg=await navigator.serviceWorker.ready;const {publicKey}=await pushCall({action:'key'});const bytes=Uint8Array.from(atob(publicKey.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(publicKey.length/4)*4,'=')),c=>c.charCodeAt(0));let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes});const j=sub.toJSON();if(user?.id!==uid)throw Error('Account changed');const r=await db.from('push_subscriptions').upsert({user_id:uid,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth},{onConflict:'user_id,endpoint'});if(r.error)throw r.error;}
async function disablePush(){if(!('serviceWorker'in navigator))return;const reg=await navigator.serviceWorker.getRegistration();const sub=await reg?.pushManager.getSubscription();if(sub){await sub.unsubscribe();if(user){const r=await db.from('push_subscriptions').delete().eq('user_id',user.id).eq('endpoint',sub.endpoint);if(r.error)throw r.error;}}}

let inboxLastFetch=0;async function refreshInbox(force=false){if(inboxBusy||!user||document.hidden||$('app').classList.contains('hidden'))return;if(force!==true&&Date.now()-inboxLastFetch<6000)return;inboxBusy=true;const uid=user.id;try{let rows=[];for(let start=0;;start+=500){const r=await db.from('direct_messages').select('id,sender_id,receiver_id,message,created_at').or('sender_id.eq.'+uid+',receiver_id.eq.'+uid).order('created_at',{ascending:false}).order('id',{ascending:false}).range(start,start+499);if(r.error)return;rows.push(...r.data);if(r.data.length<500)break}if(user?.id!==uid||$('app').classList.contains('hidden'))return;inboxLastFetch=Date.now();inboxOwner=uid;inbox=rows;paintInbox()}finally{inboxBusy=false}}
setInterval(refreshInbox,6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshInbox(true)});

function chatMeta(m,own,table){const time=new Date(m.created_at);return '<div class="chatmeta"><time>'+esc(time.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}))+'</time>'+(own&&table==='direct_messages'?'<span class="receipt '+(m.read_at?'read':'')+'" aria-label="'+(m.read_at?'Read':'Sent')+'">'+(m.read_at?'✓✓':'✓')+'</span>':'')+(own?'<details class="msgmenu"><summary aria-label="Message options">⋮</summary>'+deleteButton(table,m.id)+'</details>':'')+'</div>'}
function deleteButton(table,id){return '<button class="switch" data-delete-table="'+table+'" data-delete-id="'+esc(String(id))+'">Delete</button>'} document.addEventListener('click',async e=>{const b=e.target.closest('button[data-delete-table]');if(!b||!user)return;const t=b.dataset.deleteTable;if(!['direct_messages','general_messages','news_posts','events'].includes(t)||!/^\d+$/.test(b.dataset.deleteId))return;if(!confirm('Permanently delete this item for everyone?'))return;b.disabled=true;const r=await db.from(t).delete().eq('id',b.dataset.deleteId).select('id');if(r.error||!r.data?.length){alert(r.error?.message||'Delete permission denied.');b.disabled=false;return}(b.closest('.bubble')||b.parentElement).remove();if(t==='direct_messages')refreshInbox(true)}); async function chats(){let s=$('screen');if(!chosen){if(inboxOwner!==user.id)inbox=[];s.innerHTML=heading('Chats')+'<p class="muted small">Select a member to start a private chat.</p><div class="card" id="chatList"></div>';paintInbox();refreshInbox(true);return}
s.innerHTML=heading('<span id="back">‹</span> '+esc(chosen.display_name||chosen.username))+'<div class="card"><div id="msgs" class="messages"></div><div class="composer"><input id="msg" placeholder="Write a message"><button id="send">Send</button></div></div>';$('back').onclick=()=>{chosen=null;chats()};
const peer=chosen.id;const target=$('msgs'),uid=user.id;const controls=document.createElement('div');controls.className='card';controls.innerHTML='<button id="blockUser" class="switch">Block / Unblock</button> <button id="reportUser" class="switch">Report</button><p id="safetyStatus" class="small muted"></p>';target.parentElement.before(controls);async function blockStatus(){const r=await db.from('member_blocks').select('blocker_id,blocked_id').or('and(blocker_id.eq.'+uid+',blocked_id.eq.'+peer+'),and(blocker_id.eq.'+peer+',blocked_id.eq.'+uid+')');if(r.error||!controls.isConnected)return;const own=r.data.some(b=>b.blocker_id===uid);$('blockUser').textContent=own?'Unblock':'Block';$('send').disabled=r.data.length>0;$('msg').disabled=r.data.length>0;$('safetyStatus').textContent=r.data.length?'Private messaging unavailable.':'';return own;} $('blockUser').onclick=async()=>{const own=await blockStatus();if(own===undefined)return;if(!confirm(own?'Unblock this member?':'Block private messages with this member?'))return;const r=own?await db.from('member_blocks').delete().eq('blocker_id',uid).eq('blocked_id',peer):await db.from('member_blocks').insert({blocker_id:uid,blocked_id:peer});if(r.error)alert(r.error.message);else blockStatus()};$('reportUser').onclick=async()=>{const reason=prompt('Why are you reporting this member? (Max 500 characters)');if(!reason?.trim())return;const r=await db.from('member_reports').insert({reporter_id:uid,reported_id:peer,reason:reason.trim().slice(0,500)});alert(r.error?r.error.message:'Report submitted to moderators.');};blockStatus();watchMessages(controls,blockStatus);let busy=false;async function get(){if(busy||!target.isConnected||user?.id!==uid)return;busy=true;try{let r=await db.from('direct_messages').select('*').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+peer+'),and(sender_id.eq.'+peer+',receiver_id.eq.'+user.id+')').order('created_at').order('id');if(!target.isConnected||user?.id!==uid)return;if(!r.error&&!document.hidden){markRead(peer,r.data||[]);paintInbox();if(r.data.some(m=>m.receiver_id===uid&&!m.read_at))await db.rpc('mark_private_read',{peer});}const html=r.error?esc(r.error.message):(r.data||[]).map(m=>'<div class="bubble '+(m.sender_id===user.id?'mine':'')+'">'+esc(m.message)+chatMeta(m,m.sender_id===user.id,'direct_messages')+'</div>').join('')||'<div class="empty">No messages yet.</div>';if(target.innerHTML!==html){const follow=!target.dataset.loaded||target.scrollHeight-target.scrollTop-target.clientHeight<80;target.innerHTML=html;target.dataset.loaded='1';if(follow){target.scrollTop=target.scrollHeight;requestAnimationFrame(()=>{if(target.isConnected)target.scrollTop=target.scrollHeight;});}}}finally{busy=false}}
$('send').onclick=async()=>{let message=$('msg').value.trim();if(!message)return;let r=await db.from('direct_messages').insert({sender_id:user.id,receiver_id:chosen.id,message}).select('id').single();if(r.error)alert(r.error.message);else{$('msg').value='';get();pushCall({action:'send',id:Number(r.data.id)}).then(d=>{if(!d.sent&&!d.duplicate&&!d.muted)alert('Message sent, but no push delivered.');}).catch(e=>alert('Message sent. '+e.message))}};get();watchMessages(target,get)}
async function group(){let s=$('screen');s.innerHTML=heading('General Group')+'<p class="muted small">A group chat for all members.</p><div class="card"><div id="msgs" class="messages"></div><div class="composer"><input id="msg" placeholder="Message everyone"><button id="send">Send</button></div></div>';const target=$('msgs'),uid=user.id;let busy=false;async function get(){if(busy||!target.isConnected||user?.id!==uid)return;busy=true;try{let r=await db.from('general_messages').select('*,profiles(display_name,username)').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(100);if(!target.isConnected||user?.id!==uid)return;const html=r.error?esc(r.error.message):(r.data||[]).slice().reverse().map(m=>'<div class="bubble '+(m.user_id===user.id?'mine':'')+'"><b class="small">'+esc(m.profiles?.display_name||m.profiles?.username||'Member')+'</b><br>'+esc(m.message)+chatMeta(m,m.user_id===user.id||admin(),'general_messages')+'</div>').join('')||'<div class="empty">No messages yet.</div>';if(target.innerHTML!==html){const follow=!target.dataset.loaded||target.scrollHeight-target.scrollTop-target.clientHeight<80;target.innerHTML=html;target.dataset.loaded='1';if(follow){target.scrollTop=target.scrollHeight;requestAnimationFrame(()=>{if(target.isConnected)target.scrollTop=target.scrollHeight;});}}}finally{busy=false}}$('send').onclick=async()=>{let message=$('msg').value.trim();if(!message)return;let r=await db.from('general_messages').insert({user_id:user.id,message}).select('id').single();if(r.error)alert(r.error.message);else{$('msg').value='';get();communityPush('general_group',r.data.id)}};get();watchMessages(target,get)}
async function events(){let s=$('screen');s.innerHTML=heading('Events')+'<p class="muted small">Events and announcements from admins.</p>'+(admin()?'<div class="card"><input id="et" placeholder="Event title"><textarea id="ed" placeholder="Description"></textarea><label class="small muted">Event image (optional)</label><input id="eventImage" type="file" accept="image/jpeg,image/png,image/webp"><button id="add">Create Event</button></div>':'')+'<div id="list"></div>';const list=$('list');if(admin()){const btn=$('add');btn.onclick=async()=>{const title=$('et').value.trim(),description=$('ed').value.trim(),f=$('eventImage').files[0];if(!title)return alert('Enter an event title.');if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image under 5 MB.');btn.disabled=true;try{let image_url=null;if(f){const path=user.id+'/events/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const u=await db.storage.from('aytx-media').upload(path,f);if(u.error)throw u.error;image_url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const x=await db.from('events').insert({title,description,created_by:user.id,image_url}).select('id').single();if(x.error)throw x.error;communityPush('events',x.data.id);if(tab==='events')events()}catch(e){alert(e.message)}finally{btn.disabled=false}}}const r=await db.from('events').select('*').order('created_at',{ascending:false});list.innerHTML=r.error?esc(r.error.message):((r.data||[]).map(e=>'<div class="card"><b>'+esc(e.title)+'</b><p>'+esc(e.description)+'</p>'+(e.image_url?'<img class="postimg" data-media="'+esc(e.image_url)+'" alt="Event image">':'')+'<small class="muted">'+new Date(e.created_at).toLocaleString()+'</small>'+(admin()?deleteButton('events',e.id):'')+'</div>').join('')||'<div class="empty">No events yet.</div>')}
async function news(){let s=$('screen');s.innerHTML=heading('News')+'<p class="muted small">Share an image or screenshot with a caption.</p><div class="card"><textarea id="cap" placeholder="Write a caption"></textarea><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="post">Post</button></div><div id="list"></div>';$('post').onclick=async()=>{let f=$('file').files[0],image_url=null;if(f){if(f.size>5242880)return alert('Image must be smaller than 5 MB');let path=user.id+'/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let u=await db.storage.from('aytx-media').upload(path,f);if(u.error)return alert(u.error.message);image_url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}let x=await db.from('news_posts').insert({user_id:user.id,caption:$('cap').value.trim(),image_url}).select('id').single();if(x.error)alert(x.error.message);else{communityPush('news',x.data.id);news()}};let r=await db.from('news_posts').select('*,profiles(display_name,username)').order('created_at',{ascending:false}).limit(50);$('list').innerHTML=r.error?esc(r.error.message):(r.data||[]).map(p=>'<div class="card"><b>'+esc(p.profiles?.display_name||p.profiles?.username||'Member')+'</b><p>'+esc(p.caption)+'</p>'+(p.image_url?'<img class="postimg" data-media="'+esc(p.image_url)+'">':'')+(p.user_id===user.id?deleteButton('news_posts',p.id):'')+'</div>').join('')||'<div class="empty">No posts yet.</div>'}
async function reviewReports(){const list=$('reportList');if(!list)return;const r=await db.from('member_reports').select('id,reporter_id,reported_id,reason,created_at,status').order('created_at',{ascending:false}).limit(100);if(!list.isConnected)return;list.innerHTML=r.error?esc(r.error.message):(r.data||[]).map(x=>'<div class="card"><b>Reported: '+esc(people.find(p=>p.id===x.reported_id)?.display_name||'Member')+'</b><p>'+esc(x.reason)+'</p><small>'+esc(new Date(x.created_at).toLocaleString())+'</small><label class="small muted">Status</label><select data-report="'+esc(x.id)+'">'+['Pending','Reviewed','Resolved'].map(v=>'<option '+(v===x.status?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')||'No reports.';list.querySelectorAll('[data-report]').forEach(el=>el.onchange=async()=>{el.disabled=true;const q=await db.from('member_reports').update({status:el.value}).eq('id',el.dataset.report).select('id').single();if(q.error)alert(q.error.message);await reviewReports();});} function communityPush(kind,id){pushCall({action:'community',kind,id:Number(id)}).catch(e=>console.warn('Notification delivery error',e.message))} async function notificationPreferences(){const el=$('prefPanel');if(!el)return;const uid=user.id;const defaults={private_chat:true,general_group:false,events:true,news:false};const r=await db.from('notification_preferences').select('private_chat,general_group,events,news').eq('user_id',uid).maybeSingle();if(!el.isConnected||user?.id!==uid)return;if(r.error){el.textContent=r.error.message;return}let prefs=r.data||defaults;el.innerHTML=Object.entries({private_chat:'Private Chat',general_group:'General Group',events:'Events',news:'News'}).map(([k,v])=>'<label style="display:flex;align-items:center;justify-content:space-between;margin:12px 0">'+v+'<input style="width:auto" type="checkbox" data-pref="'+k+'" '+(prefs[k]?'checked':'')+' '+''+'></label>').join('')+'<p class="small muted">Choose which alerts you receive.</p>';el.querySelectorAll('[data-pref]').forEach(input=>input.onchange=async()=>{input.disabled=true;const q=await db.from('notification_preferences').upsert({user_id:uid,...prefs,[input.dataset.pref]:input.checked});if(q.error)alert(q.error.message);await notificationPreferences()})} async function manageMembers(){const el=$('memberList');if(!el)return;const r=await db.from('profiles').select('id,username,display_name,role,suspended').order('display_name').limit(500);if(!el.isConnected)return;if(r.error){el.textContent=r.error.message;return}el.replaceChildren();for(const p of r.data||[]){const line=document.createElement('div');line.className='card';const label=document.createElement('p');label.textContent=(p.display_name||p.username||'Member')+' · '+p.role+' · '+(p.suspended?'Suspended':'Active');line.append(label);if(profile?.role?.toLowerCase()==='owner'&&p.id!==user.id&&['member','admin'].includes(p.role.toLowerCase())){const next=p.role.toLowerCase()==='admin'?'Member':'Admin';const b=document.createElement('button');b.textContent=next==='Admin'?'Make Admin':'Remove Admin';b.onclick=async()=>{if(!confirm('Change role to '+next+'?'))return;b.disabled=true;const q=await db.rpc('manage_member_role',{target_id:p.id,next_role:next});if(q.error)alert(q.error.message);await manageMembers()};line.append(b)}if(p.id!==user.id&&!profile?.suspended&&(p.role.toLowerCase()==='member'||(profile?.role?.toLowerCase()==='owner'&&p.role.toLowerCase()==='admin'))){const b=document.createElement('button');b.className='switch';b.textContent=p.suspended?'Unsuspend':'Suspend';b.onclick=async()=>{if(!confirm(b.textContent+' this member?'))return;b.disabled=true;const q=await db.rpc('manage_member_suspension',{target_id:p.id,next_status:!p.suspended});if(q.error)alert(q.error.message);await manageMembers()};line.append(b)}el.append(line)}} function profilePage(){let p=profile||{};$('screen').innerHTML=heading('Profile')+'<div class="card">'+avatar(p)+'<b>'+esc(p.display_name||p.username||'Member')+'</b><p class="muted small">@'+esc(p.username||'')+' · '+esc(p.role||'Member')+'</p></div><div class="card"><label class="small muted">Display name</label><input id="pn" value="'+esc(p.display_name||'')+'"><label class="small muted">Profile photo (optional)</label><input id="pa" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted small">Choose a gaming avatar. JPG, PNG or WebP, up to 5 MB.</p><button id="save" class="full">Save Profile</button></div><div class="card muted small">'+esc(user.email||'')+'</div><div class="card"><b>Notifications</b><p class="muted small">New private message alerts. Message text is hidden on the lock screen.</p><button id="pushOn">Enable notifications</button> <button id="pushOff" class="switch">Disable</button><p id="pushStatus" class="small muted"></p><div id="prefPanel"></div></div><button id="out" class="danger full">Logout</button>';notificationPreferences();if(admin()){const div=document.createElement('div');div.className='card';div.innerHTML='<button id="reviewReports">Review reports</button><div id="reportList"></div>';$('out').before(div);const members=document.createElement('div');members.className='card';members.innerHTML='<button id="manageMembers">Member Management</button><div id="memberList"></div>';$('out').before(members);$('manageMembers').onclick=manageMembers;$('reviewReports').onclick=reviewReports;}$('save').onclick=async()=>{const btn=$('save'),f=$('pa').files[0],name=$('pn').value.trim();if(!name)return alert('Enter a display name.');if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image up to 5 MB.');btn.disabled=true;try{let url=p.avatar_url||null;if(f){const path=user.id+'/avatars/'+crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type]);const u=await db.storage.from('aytx-media').upload(path,f);if(u.error)throw u.error;url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const r=await db.from('profiles').update({display_name:name,avatar_url:url}).eq('id',user.id);if(r.error)throw r.error;await load();alert('Profile saved')}catch(e){alert(e.message)}finally{btn.disabled=false}};$('pushOn').onclick=async()=>{const s=$('pushStatus');try{await enablePush();s.textContent='Notifications enabled. Ready to test.'}catch(e){s.textContent=e.message}};$('pushOff').onclick=async()=>{try{await disablePush();$('pushStatus').textContent='Notifications disabled.'}catch(e){$('pushStatus').textContent=e.message}};$('out').onclick=async()=>{try{await disablePush();await db.auth.signOut()}catch(e){alert(e.message)}}}
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
