const mediaPending=new WeakSet(),mediaCache=new Map();function secureImages(){for(const img of document.querySelectorAll('img[data-media]'))secureImage(img);}async function secureImage(img){if(mediaPending.has(img)||!user)return;mediaPending.add(img);const uid=user.id;img.decoding='async';let placeholder=null;const finish=(ok)=>{if(!placeholder)return;if(ok){placeholder.remove();img.classList.remove('media-wait');}else{placeholder.classList.add('media-failed');placeholder.textContent='Image unavailable';} };if(img.classList.contains('postimg')){img.loading='eager';img.classList.add('media-wait');placeholder=document.createElement('div');placeholder.className='media-loading';placeholder.setAttribute('role','status');placeholder.textContent='Loading image…';img.before(placeholder);img.addEventListener('load',()=>finish(true),{once:true});img.addEventListener('error',()=>finish(false),{once:true});}try{const u=new URL(img.dataset.media),prefix='/storage/v1/object/public/aytx-media/';if(u.origin!=='https://qverihfqvbqljctwppos.supabase.co'||!u.pathname.startsWith(prefix)){finish(false);return;}const path=decodeURIComponent(u.pathname.slice(prefix.length)),key=uid+':'+path;let entry=mediaCache.get(key);if(!entry||entry.until<Date.now()){entry={until:Date.now()+240000,promise:db.storage.from('aytx-media').createSignedUrl(path,300)};mediaCache.set(key,entry);if(mediaCache.size>300)mediaCache.delete(mediaCache.keys().next().value);}const r=await entry.promise;if(r.error){if(mediaCache.get(key)===entry)mediaCache.delete(key);finish(false);return;}if(img.isConnected&&user?.id===uid)img.src=r.data.signedUrl;}catch{finish(false);}} const mediaObserver=new MutationObserver(secureImages);mediaObserver.observe(document.body,{childList:true,subtree:true});

const peer=chosen.id;const target=$('msgs'),uid=user.id;const controls=document.createElement('div');controls.className='card';controls.innerHTML='<button id="blockUser" class="switch">Block / Unblock</button> <button id="reportUser" class="switch">Report</button><p id="safetyStatus" class="small muted"></p>';target.parentElement.before(controls);async function blockStatus(){const r=await db.from('member_blocks').select('blocker_id,blocked_id').or('and(blocker_id.eq.'+uid+',blocked_id.eq.'+peer+'),and(blocker_id.eq.'+peer+',blocked_id.eq.'+uid+')');if(r.error||!controls.isConnected)return;const own=r.data.some(b=>b.blocker_id===uid);$('blockUser').textContent=own?'Unblock':'Block';$('send').disabled=r.data.length>0;$('msg').disabled=r.data.length>0;$('safetyStatus').textContent=r.data.length?'Private messaging unavailable.':'';return own;} $('blockUser').onclick=async()=>{const own=await blockStatus();if(own===undefined)return;if(!confirm(own?'Unblock this member?':'Block private messages with this member?'))return;const r=own?await db.from('member_blocks').delete().eq('blocker_id',uid).eq('blocked_id',peer):await db.from('member_blocks').insert({blocker_id:uid,blocked_id:peer});if(r.error)alert(r.error.message);else blockStatus()};$('reportUser').onclick=async()=>{const reason=prompt('Why are you reporting this member? (Max 500 characters)');if(!reason?.trim())return;const r=await db.from('member_reports').insert({reporter_id:uid,reported_id:peer,reason:reason.trim().slice(0,500)});alert(r.error?r.error.message:'Report submitted to moderators.');};blockStatus();watchMessages(controls,blockStatus);let busy=false;async function get(){if(busy||!target.isConnected||user?.id!==uid)return;busy=true;try{let r=await db.from('direct_messages').select('*').or('and(sender_id.eq.'+user.id+',receiver_id.eq.'+peer+'),and(sender_id.eq.'+peer+',receiver_id.eq.'+user.id+')').order('created_at').order('id');if(!target.isConnected||user?.id!==uid)return;if(!r.error&&!document.hidden){markRead(peer,r.data||[]);paintInbox();}const html=r.error?esc(r.error.message):(r.data||[]).map(m=>'<div class="bubble '+(m.sender_id===user.id?'mine':'')+'">'+esc(m.message)+chatMeta(m,m.sender_id===user.id,'direct_messages')+'</div>').join('')||'<div class="empty">No messages yet.</div>';if(target.innerHTML!==html){const follow=!target.dataset.loaded||target.scrollHeight-target.scrollTop-target.clientHeight<80;target.innerHTML=html;target.dataset.loaded='1';if(follow){target.scrollTop=target.scrollHeight;requestAnimationFrame(()=>{if(target.isConnected)target.scrollTop=target.scrollHeight;});}}}finally{busy=false}}

async function compressPhoto(file,maxSide=1600){const url=URL.createObjectURL(file);let canvas;try{const img=new Image();img.src=url;await img.decode();const w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw Error('Invalid image');const scale=Math.min(1,maxSide/Math.max(w,h));canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));const ctx=canvas.getContext('2d');if(!ctx)throw Error('Image processing unavailable');ctx.drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.84));return blob&&blob.size<file.size?blob:file;}catch{return file;}finally{URL.revokeObjectURL(url);if(canvas){canvas.width=1;canvas.height=1}}}

async function news(){const s=$('screen'),uid=user.id;s.innerHTML=heading('News')+'<p class="muted small">Community feed · Share your updates</p><div class="card news-compose"><div class="news-author">'+avatar(profile)+'<b>Create a post</b></div><textarea id="cap" placeholder="What would you like to share?"></textarea><label class="news-attach" for="file">＋ Add photo</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><p id="photoName" class="small muted"></p><button id="post">Publish post</button></div><div id="list" aria-live="polite"></div>';const list=$('list'),btn=$('post'),file=$('file');file.onchange=()=>{$('photoName').textContent=file.files[0]?.name||''};btn.onclick=async()=>{const f=file.files[0],caption=$('cap').value.trim();if(!f&&!caption)return alert('Write a caption or add a photo.');if(f&&(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image under 5 MB.');btn.disabled=true;btn.textContent='Publishing…';try{let image_url=null;if(f){const path=uid+'/news/'+crypto.randomUUID();btn.textContent='Compressing image…';const photo=await compressPhoto(f);btn.textContent='Uploading image…';if(user?.id!==uid)throw Error('Session changed');const u=await db.storage.from('aytx-media').upload(path,photo,{contentType:photo.type});if(u.error)throw u.error;image_url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const x=await db.from('news_posts').insert({user_id:uid,caption,image_url}).select('id').single();if(x.error)throw x.error;communityPush('news',x.data.id);if(list.isConnected&&user?.id===uid)news()}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='Publish post'}};list.textContent='Loading posts…';const r=await db.from('news_posts').select('*,profiles(display_name,username,avatar_url)').order('created_at',{ascending:false}).limit(50);if(!list.isConnected||user?.id!==uid)return;list.innerHTML=r.error?esc(r.error.message):((r.data||[]). async function reviewReports(){const list=$('reportList');if(!list)return;const r=await db.from('member_reports').select('id,reporter_id,reported_id,reason,created_at,status').order('created_at',{ascending:false}).limit(100);if(!list.isConnected)return;list.innerHTML=r.error?esc(r.error.message):(r.data||[]).map(x=>'<div class="card"><b>Reported: '+esc(people.find(p=>p.id===x.reported_id)?.display_name||'Member')+'</b><p>'+esc(x.reason)+'</p><small>'+esc(new Date(x.created_at).toLocaleString())+'</small><label class="small muted">Status</label><select data-report="'+esc(x.id)+'">'+['Pending','Reviewed','Resolved'].map(v=>'<option '+(v===x.status?'selected':'')+'>'+v+'</option>').join('')+'</select></div>').join('')||'No reports.';list.querySelectorAll('[data-report]').forEach(el=>el.onchange=async()=>{el.disabled=true;const q=await db.from('member_reports').update({status:el.value}).eq('id',el.dataset.report).select('id').single();if(q.error)alert(q.error.message);await reviewReports();});} function communityPush(kind,id){pushCall({action:'community',kind,id:Number(id)}).catch(e=>console.warn('Notification delivery error',e.message))} async function notificationPreferences(){const el=$('prefPanel');if(!el)return;const uid=user.id;const defaults={private_chat:true,general_group:false,events:true,news:false};const r=await db.from('notification_preferences').select('private_chat,general_group,events,news').eq('user_id',uid).maybeSingle();if(!el.isConnected||user?.id!==uid)return;if(r.error){el.textContent=r.error.message;return}let prefs=r.data||defaults;el.innerHTML=Object.entries({private_chat:'Private Chat',general_group:'General Group',events:'Events',news:'News'}).map(([k,v])=>'<label style="display:flex;align-items:center;justify-content:space-between;margin:12px 0">'+v+'<input style="width:auto" type="checkbox" data-pref="'+k+'" '+(prefs[k]?'checked':'')+' '+''+'></label>').join('')+'<p class="small muted">Choose which alerts you receive.</p>';el.querySelectorAl ass="muted small">@'+esc(p.username||'')+' · '+esc(p.role||'Member')+'</p></div><div class="card"><label class="small muted">Display name</label><input id="pn" value="'+esc(p.display_name||'')+'"><label class="small muted">Profile photo (optional)</label><input id="pa" type="file" accept="image/jpeg,image/png,image/webp"><p class="muted small">Choose a gaming avatar. JPG, PNG or WebP, up to 5 MB.</p><button id="save" class="full">Save Profile</button></div><div class="card muted small">'+esc(user.email||'')+'</div><div class="card"><b>Notifications</b><p class="muted small">New private message alerts. Message text is hidden on the lock screen.</p><button id="pushOn">Enable notifications</button> <button id="pushOff" class="switch">Disable</button><p id="pushStatus" class="small muted"></p><div id="prefPanel"></div></div><button id="out" class="danger full">Logout</button><p class="small muted" style="text-align:center;margin:20px 0 4px">AYTx · Version 1.0.0</p><p class="small muted" style="text-align:center">Gaming community · Keep your account and personal information safe.</p>';notificationPreferences();if(admin()){const div=document.createElement('div');div.className='card';div.innerHTML='<button id="reviewReports">Review reports</button><div id="reportList"></div>';$('out').before(div);const members=document.createElement('div');members.className='card';members.innerHTML='<button id="manageMembers">Member Management</button><div id="memberList"></div>';$('out').before(members);$('manageMembers').onclick=manageMembers;$('reviewReports').onclick=reviewReports;}$('save').onclick=async()=>{const btn=$('save'),f=$('pa').files[0],name=$('pn').value.trim();if(!name)return alert('Enter a display name.');if(f&&(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880))return alert('Choose a JPG, PNG or WebP image up to 5 MB.');btn.disabled=true;try{let url=p.avatar_url||null;if(f){const uid=user.id;btn.textContent='Compressing image…';const photo=await compressPhoto(f,512);if(user?.id!==uid)throw Error('Session changed');const path=uid+'/avatars/'+crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[photo.type]);btn.textContent='Uploading image…';const u=await db.storage.from('aytx-media').upload(path,photo,{contentType:photo.type});if(u.error)throw u.error;url=db.storage.from('aytx-media').getPublicUrl(path).data.publicUrl}const r=await db.from('profiles').update({display_name:name,avatar_url:url}).eq('id',user.id);if(r.error)throw r.error;await load();alert('Profile saved')}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='Save Profile'}};$('pushOn').onclick=async()=>{const s=$('pushStatus');try{await enablePush();s.textContent='Notifications enabled. Ready to test.'}catch(e){s.textContent=e.message}};$('pushOff').onclick=async()=>{try{await disablePush();$('pushStatus').textContent='Notifications disabled.'}catch(e){$('pushStatus').textContent=e.message}};$('out').onclick=async()=>{try{await disablePush();await db.auth.signOut()}catch(e){alert(e.message)}}}
